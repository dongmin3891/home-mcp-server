apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-mcp-server
  namespace: mcp
spec:
  ingressClassName: traefik
  rules:
    - host: mcp.ddongmy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-mcp-server
                port:
                  number: 80
  tls:
    - hosts:
        - mcp.ddongmy.com
      secretName: home-mcp-server-tls
